<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RUKA · ตัวอย่างสีเคลื่อนไหว</title><style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap');

</style><main><div class="ey">RUKA / MOTION PREVIEW</div><h1>เริ่มเล็ก เล่นใหญ่<br>เป็นไปได้ใน<span class="gradient">แบบคุณ.</span></h1><div class="cards"><div class="card one"><div class="label">01 / STARTER</div><div class="number">20K</div><div class="copy">เริ่มให้คนจำแบรนด์ ↗</div></div><div class="card two"><div class="label">02 / PLUS</div><div class="number">50K</div><div class="copy">เติมไอเดียให้ครบเซ็ต ↗</div></div><div class="card three"><div class="label">03 / CUSTOM</div><div class="number">YOUR<br>BUDGET</div><div class="copy">มีงบในใจแล้ว? ↗</div></div></div><footer><button id="toggle" aria-pressed="false">หยุดสีชั่วคราว</button><span>สีเคลื่อนเฉพาะ “แบบคุณ.” · ตัวอย่างแยก ยังไม่ได้เปลี่ยนเว็บจริง</span></footer></main><script>const b=document.querySelector('#toggle');b.onclick=()=>{const p=document.body.classList.toggle('paused');b.setAttribute('aria-pressed',p);b.textContent=p?'เล่นสีต่อ':'หยุดสีชั่วคราว'};</script></html>
